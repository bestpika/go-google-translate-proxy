openapi: 3.0.3
info:
  title: Immersive Translate Google 翻譯代理
  version: 0.1.0
  description: 將 Google Translate translateHtml 包裝成 Immersive Translate 自訂 API 的服務。
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: 存活檢查
      description: 不呼叫 Google，不保證上游可用；其他 HTTP 方法回傳 405 與 Allow 標頭。
      operationId: healthz
      responses:
        "200":
          description: 服務正常
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
        "405":
          description: HTTP 方法不支援
          headers:
            Allow:
              schema:
                type: string
                enum: [GET]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /translate:
    post:
      summary: 翻譯文字陣列
      description: 保持翻譯筆數與順序。建議 application/json，但不強制檢查 Content-Type；其他 HTTP 方法回傳 405。
      operationId: translate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslateRequest"
            examples:
              basic:
                value:
                  source_lang: en
                  target_lang: zh-TW
                  text_list:
                    - Hello world
      responses:
        "200":
          description: 翻譯成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslateResponse"
        "400":
          description: 格式或欄位錯誤、未知欄位或尾端額外內容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: 請求 body 超過 1 MiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: HTTP 方法不支援
          headers:
            Allow:
              schema:
                type: string
                enum: [POST]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 服務設定錯誤
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: 上游錯誤、格式或筆數不符、回應超過 1 MiB、取消或逾時
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    TranslateRequest:
      type: object
      additionalProperties: false
      description: 單一 JSON 物件，含尾端空白最大 1 MiB；不接受額外 JSON 或非空白內容。
      required:
        - target_lang
        - text_list
      properties:
        source_lang:
          type: string
          nullable: true
          description: 來源語言代碼，去除前後空白後空值或 null 視為 auto。
          example: en
        target_lang:
          type: string
          minLength: 1
          pattern: '\S'
          description: 目標語言代碼，去除前後空白後不可為空。
          example: zh-TW
        text_list:
          type: array
          description: 待翻譯文字清單，保留每筆文字的原始空白。
          minItems: 1
          items:
            type: string
            minLength: 1
          example:
            - Hello world
    TranslateResponse:
      type: object
      required:
        - translations
      properties:
        translations:
          type: array
          items:
            $ref: "#/components/schemas/Translation"
    Translation:
      type: object
      required:
        - detected_source_lang
        - text
      properties:
        detected_source_lang:
          type: string
          description: 使用的來源語言，auto 原樣回傳，不代表真正偵測結果。
          example: en
        text:
          type: string
          description: 翻譯後文字。
          example: 你好，世界
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: invalid request body
